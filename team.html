<!DOCTYPE html>
<html lang="az">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Komanda</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="icon" type="image/png" href="favicon.png">
</head>
<body data-page="team">

  <!-- ── Naviqasiya ── -->
  <nav class="navbar">
    <div class="container">
      <a class="navbar-brand" href="index.html">
        <img src="favicon.png" style="height: 40px;" alt="">
        Şamaxı FK
      </a>
      <button class="navbar-toggler" id="navToggler" aria-label="Menyu">
        <span></span><span></span><span></span>
      </button>
      <div class="navbar-collapse" id="navMenu">
        <ul class="navbar-nav">
          <li class="nav-item"><a class="nav-link" href="index.html">Ana Səhifə</a></li>
          <li class="nav-item"><a class="nav-link active" href="team.html">Komanda</a></li>
          <li class="nav-item"><a class="nav-link" href="matches.html">Oyunlar</a></li>
          
        </ul>
      </div>
    </div>
  </nav>

  <!-- ── Səhifə Başlığı ── -->
  <section class="section-pad-sm page-section" style="background: linear-gradient(135deg, #050d1a, #071e3d); border-bottom: 1px solid var(--clr-border);">
    <div class="container">
      <div class="section-label">Heyət</div>
      <h1 class="section-title">KOMANDA / HEYƏT</h1>
      <div class="section-divider"></div>
      <p class="text-muted-c" style="max-width:500px">Şamaxı FK-nın güclü oyunçu heyəti. Hər mövqedə peşəkar futbolçular.</p>
    </div>
  </section>

  <!-- ── Filtr ── -->
  <section class="section-pad-sm page-section">
    <div class="container">
      
      <div class="d-flex gap-4 flex-wrap mb-5" style="font-family:var(--font-heading);font-size:0.78rem;color:var(--clr-muted)">
        <span><span class="player-position-dot pos-gk" style="display:inline-block;width:8px;height:8px;border-radius:50%;vertical-align:middle;margin-right:4px"></span>Qapıçı</span>
        <span><span class="player-position-dot pos-def" style="display:inline-block;width:8px;height:8px;border-radius:50%;vertical-align:middle;margin-right:4px"></span>Müdafiəçi</span>
        <span><span class="player-position-dot pos-mid" style="display:inline-block;width:8px;height:8px;border-radius:50%;vertical-align:middle;margin-right:4px"></span>Yarımmüdafiəçi</span>
        <span><span class="player-position-dot pos-fwd" style="display:inline-block;width:8px;height:8px;border-radius:50%;vertical-align:middle;margin-right:4px"></span>Hücumçu</span>
      </div>

      <div class="row g-3" id="players-grid">
        <div class="col-12 text-center py-5">
          <div class="loading-spinner mx-auto"></div>
        </div>
      </div>
    </div>
  </section>

  <!-- ── Footer ── -->

   <div style="padding: 40px;" class="footer-bottom">
        © 2025 Şamaxı FK. Bütün hüquqlar qorunur.
      </div>


  <script src="js/main.js"></script>
</body>
</html>
